<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#14171c">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚉</text></svg>">
<title>Tabellone stazione — Monitor Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ================================================================
     tabellone_stazione.html — v1.2 (2026-10-25)
     Novita' v1.2: la riga VT spiega PERCHE' manca il dato invece del
     generico "VT —": "VT non partito" (treno non ancora partito, nessun
     ritardo disponibile), "VT fermata n/d" (la fermata di questa stazione
     non e' stata trovata nel percorso VT), "VT no dati" (ViaggiaTreno non
     ha risposto o non conosce il treno oggi).
     v1.1 (2026-10-25)
     Novita' v1.1: accanto allo stato RFI di ogni treno compare anche il
     ritardo ViaggiaTreno (riga "VT ..."), come nella pagina principale.
     Usa il parametro ?codVT=... che dettaglio_treno.html (v1.8+) gia'
     passa quando la stazione ha un match in stazioni_ridotte.json; per
     ogni treno della lista legge DENO_URL/treno/{numero} (stesso endpoint
     di dettaglio_treno.html), trova la fermata di QUESTA stazione (per
     codice, con fallback sul nome) e ne mostra il ritardo: quello reale
     registrato alla fermata se il treno c'e' gia' passato, altrimenti il
     ritardo attuale del treno marcato "stima". Se manca codVT la riga VT
     non compare e viene mostrata una nota. Le richieste VT partono DOPO
     il disegno della lista RFI (la lista non aspetta) e sono limitate a
     4 in parallelo e ai primi 20 treni. Se ViaggiaTreno non risponde,
     lo stato RFI resta invariato (degrado controllato, nessun errore).
     v1.0 (2026-09-10): pagina standalone: tabellone RFI (partenze/arrivi) per UNA
     stazione qualsiasi identificata da placeId — non solo le poche
     stazioni configurate come tab in dashboard_live.html. Aperta in
     nuova scheda dal click su una fermata intermedia nella timeline
     di dettaglio_treno.html (v1.7).
     Parametri URL: ?placeId=NNN&nome=NOME (nome solo per il titolo,
     placeId e' l'unico dato realmente necessario per la fetch).
     Dati da: DENO_URL/rfi-tabellone/{placeId} (stesso endpoint usato
     dal modulo Treni di dashboard_live.html). Solo fonte RFI, niente
     arricchimento ViaggiaTreno dual-source qui — questa e' una pagina
     di consultazione rapida per stazioni non abituali, non il
     tabellone principale: teniamola volutamente piu' semplice.
     Stessa identita' cromatica (ambra) del resto del modulo treni.
     ================================================================ */
  :root {
    --bg: #14171c;
    --bg-panel: #1c2029;
    --rule: #2a2f3a;
    --amber: #f0b429;
    --amber-dim: #a8801f;
    --text: #e8e6df;
    --text-muted: #7d828c;
    --red: #e2574c;
    --green: #4caf7d;
    --font-mono: 'JetBrains Mono', monospace;
    --font-sans: 'IBM Plex Sans', sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-sans); -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 1rem 1rem 3rem; }

  header { padding: 1.25rem 0 1rem; border-bottom: 1px solid var(--rule); margin-bottom: 1rem; }
  .btn-indietro { background: none; border: none; color: var(--text-muted); font-size: 0.8rem; padding: 0; cursor: pointer; font-family: var(--font-sans); margin-bottom: 10px; }
  .stazione-nome { font-size: 1.3rem; font-weight: 700; color: var(--amber); }

  .toggle-pa { display: flex; gap: 8px; margin: 0.9rem 0; }
  .toggle-pa button { flex: 1; padding: 8px 0; background: var(--bg-panel); border: 1px solid var(--rule); border-radius: 8px; color: var(--text-muted); font-family: var(--font-sans); font-weight: 600; font-size: 0.82rem; cursor: pointer; }
  .toggle-pa button.attivo { background: rgba(240,180,41,0.12); border-color: var(--amber-dim); color: var(--amber); }

  .treno-list-wrap { border: 1px solid var(--rule); border-radius: 10px; background: var(--bg-panel); overflow: hidden; }
  .treno-row { display: flex; justify-content: space-between; align-items: center; padding: 9px 12px; border-bottom: 1px solid var(--rule); gap: 8px; text-decoration: none; color: inherit; cursor: pointer; }
  .treno-row:active { background: rgba(255,255,255,0.03); }
  .treno-row:last-child { border-bottom: none; }
  .treno-sx { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .treno-num-riga { display: flex; align-items: baseline; gap: 6px; }
  .treno-num { font-family: var(--font-mono); color: var(--amber); font-weight: 700; font-size: 0.85rem; }
  .treno-cat { font-size: 0.65rem; color: var(--text-muted); text-transform: uppercase; }
  .treno-dest { font-size: 0.8rem; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .treno-dx { text-align: right; flex-shrink: 0; }
  .treno-orario { font-family: var(--font-mono); font-size: 0.95rem; font-weight: 700; }
  .treno-bin { font-size: 0.68rem; color: var(--text-muted); }
  .treno-stato { font-size: 0.66rem; margin-top: 2px; text-transform: uppercase; letter-spacing: 0.02em; }
  .stato-in_orario { color: var(--green); }
  .stato-ritardo { color: var(--amber); }
  .stato-cancellato { color: var(--red); font-weight: 700; }
  .stato-sconosciuto { color: var(--text-muted); }

  .treno-vt { font-size: 0.64rem; margin-top: 1px; font-family: var(--font-mono); color: var(--text-muted); white-space: nowrap; }
  .treno-vt.vt-ok { color: var(--green); }
  .treno-vt.vt-ritardo { color: var(--amber); }
  .treno-vt.vt-cancellato { color: var(--red); font-weight: 700; }
  .nota-vt { text-align: center; font-size: 0.7rem; color: var(--text-muted); padding: 8px 0 0; }
  .rfi-link-esterno { display: block; text-align: center; font-size: 0.72rem; color: var(--text-muted); padding: 12px 0 4px; }
  .rfi-link-esterno a { color: var(--text-muted); }

  .loading, .vuoto, .errore { text-align: center; padding: 2rem 1rem; color: var(--text-muted); font-size: 0.85rem; }
  .errore { color: var(--red); }

  footer { text-align: center; font-size: 0.68rem; color: var(--text-muted); margin-top: 2rem; font-family: var(--font-mono); line-height: 1.7; }
  .footer-rev { opacity: 0.6; }
</style>
</head>
<body>
<div class="wrap">
  <button class="btn-indietro" onclick="window.close()">← Chiudi scheda</button>
  <header>
    <div class="stazione-nome" id="nomeStazioneEl">—</div>
  </header>

  <div class="toggle-pa" id="togglePA">
    <button id="btnPartenze" onclick="selModalita('partenze')">Partenze</button>
    <button id="btnArrivi" onclick="selModalita('arrivi')">Arrivi</button>
  </div>
  <div class="treno-list-wrap">
    <div id="treniEl"><div class="loading">Caricamento...</div></div>
  </div>
  <div class="nota-vt" id="notaVT"></div>
  <div class="rfi-link-esterno" id="rfiLinkEsterno"></div>

  <footer>
    Dati Monitor RFI + ViaggiaTreno (via proxy Deno) · pagina generata dal click su una fermata<br>
    <span class="footer-rev">tabellone_stazione.html v1.2</span>
  </footer>
</div>

<script>
// ================================================================
// tabellone_stazione.html — v1.2 (2026-10-25)
// Vedi commento di versione nel <style> per i dettagli.
// ================================================================
const DENO_URL = 'https://happy-ferret-5445.j0ky0.deno.net';

const params = new URLSearchParams(window.location.search);
const placeId = params.get('placeId');
const nomeStazione = params.get('nome') || 'Stazione';
const codVT = (params.get('codVT') || '').trim();   // codice ViaggiaTreno della stazione (es. S08409)

let modalitaAttiva = 'partenze';

document.title = `${nomeStazione} — Monitor Live`;
document.getElementById('nomeStazioneEl').textContent = nomeStazione;

function renderTogglePA() {
  document.getElementById('btnPartenze').classList.toggle('attivo', modalitaAttiva === 'partenze');
  document.getElementById('btnArrivi').classList.toggle('attivo', modalitaAttiva === 'arrivi');
}

function selModalita(modalita) {
  modalitaAttiva = modalita;
  renderTogglePA();
  caricaTabellone();
}

function aggiornaLinkRfi() {
  const arrivals = modalitaAttiva === 'arrivi';
  const url = `https://iechub.rfi.it/ArriviPartenze/ArrivalsDepartures/Monitor?placeId=${placeId}&arrivals=${arrivals}`;
  document.getElementById('rfiLinkEsterno').innerHTML =
    `<a href="${url}" target="_blank" rel="noopener">Apri il tabellone ufficiale RFI ↗</a>`;
}

function formattaStatoTreno(t) {
  const stato = t.stato || 'sconosciuto';
  const mappaTesto = {
    in_orario: 'In orario',
    ritardo: t.ritardoAriaLabel || (t.ritardoTesto ? `Ritardo ${t.ritardoTesto}'` : 'In ritardo'),
    cancellato: 'Cancellato',
    sconosciuto: '—'
  };
  return `<div class="treno-stato stato-${stato}">${mappaTesto[stato] || stato}</div>`;
}

async function caricaTabellone() {
  const el = document.getElementById('treniEl');

  if (!placeId) {
    el.innerHTML = '<div class="errore">Nessuna stazione specificata nell\'URL (manca ?placeId=...)</div>';
    return;
  }

  el.innerHTML = '<div class="loading">Caricamento tabellone...</div>';
  aggiornaLinkRfi();

  try {
    const arrivals = modalitaAttiva === 'arrivi';
    const risposta = await fetch(`${DENO_URL}/rfi-tabellone/${placeId}?arrivals=${arrivals}`);
    const json = await risposta.json();

    if (json.errore) {
      el.innerHTML = `<div class="errore">Errore: ${json.errore}</div>`;
      return;
    }

    const lista = Array.isArray(json) ? json : (json.treni || []);

    if (lista.length === 0) {
      el.innerHTML = '<div class="vuoto">Nessun treno nella finestra attuale</div>';
      return;
    }

    el.innerHTML = lista.map(t => {
      const binario = t.binario || '—';
      return `
        <a class="treno-row" href="dettaglio_treno.html?numero=${t.numeroTreno}" target="_blank" rel="noopener">
          <div class="treno-sx">
            <div class="treno-num-riga">
              <span class="treno-num">${t.numeroTreno}</span>
              <span class="treno-cat">${t.operatore || ''} ${t.categoria || ''}</span>
            </div>
            <div class="treno-dest">${t.stazione || '—'}</div>
          </div>
          <div class="treno-dx">
            <div class="treno-orario">${t.orario || '—'}</div>
            <div class="treno-bin">bin. ${binario}</div>
            ${formattaStatoTreno(t)}
            ${codVT ? `<div class="treno-vt" id="vt-${t.numeroTreno}">VT …</div>` : ''}
          </div>
        </a>`;
    }).join('');

    arricchisciConViaggiaTreno(lista, arrivals);

  } catch (errore) {
    el.innerHTML = `<div class="errore">Errore di connessione: ${errore.message}</div>`;
  }
}

// ---------------------------------------------------------------
// v1.1 — arricchimento con ViaggiaTreno
// ---------------------------------------------------------------
let tokenVT = 0;   // invalida le risposte VT di un tabellone ormai sostituito (cambio Partenze/Arrivi)

function normalizzaNome(nome) {
  return (nome || '')
    .normalize('NFKD').replace(/[\u0300-\u036f]/g, '')
    .toUpperCase()
    .replace(/['.]/g, '')
    .replace(/-/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
}

function trovaFermataVT(json) {
  const fermate = Array.isArray(json.fermate) ? json.fermate : [];
  const cod = codVT.toUpperCase();
  let f = fermate.find(x => (x.id || '').toUpperCase() === cod);
  if (!f && nomeStazione !== 'Stazione') {
    const n = normalizzaNome(nomeStazione);
    f = fermate.find(x => normalizzaNome(x.stazione) === n);
  }
  return f || null;
}

function descriviRitardoVT(json, arrivals) {
  if (json.subTitle === 'Treno cancellato') return { testo: 'VT cancellato', classe: 'vt-cancellato' };
  const f = trovaFermataVT(json);
  if (!f) return { testo: 'VT fermata n/d', classe: '' };

  const reale = arrivals ? f.arrivoReale : f.partenzaReale;
  const specifico = arrivals ? f.ritardoArrivo : f.ritardoPartenza;
  let min, stima = false;
  if (reale && typeof specifico === 'number') {
    min = specifico;
  } else if (typeof json.ritardo === 'number') {
    min = json.ritardo;
    stima = true;
  } else if (json.nonPartito === true || /non partito/i.test(json.compRitardo || '')) {
    return { testo: 'VT non partito', classe: '' };
  } else {
    return { testo: 'VT no dati', classe: '' };
  }

  let testo;
  if (min > 0) testo = `VT +${min}'`;
  else if (min < 0) testo = `VT ${min}'`;
  else testo = 'VT in orario';
  if (stima) testo += ' (stima)';
  return { testo, classe: min > 0 ? 'vt-ritardo' : 'vt-ok' };
}

async function arricchisciConViaggiaTreno(lista, arrivals) {
  const nota = document.getElementById('notaVT');
  if (!codVT) {
    nota.textContent = 'Ritardo ViaggiaTreno non disponibile: stazione non abbinata (manca codVT nel link).';
    return;
  }
  nota.textContent = '';

  const mioToken = ++tokenVT;
  const numeri = [...new Set(lista.map(t => t.numeroTreno).filter(Boolean))].slice(0, 20);
  let indice = 0;

  async function lavoratore() {
    while (indice < numeri.length) {
      const numero = numeri[indice++];
      let esito = { testo: 'VT no dati', classe: '' };
      try {
        const r = await fetch(`${DENO_URL}/treno/${encodeURIComponent(numero)}`);
        const json = await r.json();
        if (!json.errore) esito = descriviRitardoVT(json, arrivals);
      } catch { /* ViaggiaTreno non risponde: resta "VT no dati", lo stato RFI non cambia */ }
      if (mioToken !== tokenVT) return;
      const el = document.getElementById(`vt-${numero}`);
      if (el) { el.textContent = esito.testo; el.className = `treno-vt ${esito.classe}`.trim(); }
    }
  }
  await Promise.all([lavoratore(), lavoratore(), lavoratore(), lavoratore()]);
}

renderTogglePA();
caricaTabellone();
</script>
</body>
</html>
