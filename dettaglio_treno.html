<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#14171c">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚆</text></svg>">
<title>Dettaglio treno — Monitor Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ================================================================
     dettaglio_treno.html — v1.9 (2026-09-11)
     Pagina standalone: percorso completo di un treno (tutte le
     fermate, orari teorici/reali, ritardi, binari). Aperta in nuova
     scheda dal click sul numero treno nel Monitor RFI.
     Dati da: DENO_URL/treno/{numero} (proxy ViaggiaTreno andamentoTreno).
     Stessa identità cromatica (ambra) del modulo Treni di dashboard_live.html.
     Novità v1.9: elenco treni preferiti FISSI (TRENI_PREFERITI_FISSI:
     598, 4721, 4097, 4523, 20677, 20703, 20711 — verificati sul foglio
     Excel "Treni Archivio", classificazione 1/priorita' massima per
     tutti e 7). Sempre marcati ★, non rimovibili dalla stellina qui
     (serve modificare l'array nel codice). STESSA costante duplicata
     in dashboard_live.html — da tenere sincronizzata a mano tra i due
     file, nessun modo automatico senza backend.
     Novità v1.8: il link verso tabellone_stazione.html ora include
     anche &codVT=... (codice ViaggiaTreno della stazione, quando il
     match in stazioni_ridotte.json lo fornisce), cosi' il tabellone
     della fermata puo' mostrare anche il ritardo ViaggiaTreno
     affiancato a quello RFI, non solo RFI da solo.
     Novità v1.7: fermate cliccabili nella timeline. Ogni nome fermata
     con un match in stazioni_ridotte.json (nuovo file, da ospitare
     nella stessa cartella su GitHub Pages — sottoinsieme di 459
     stazioni: Lazio+Umbria per intero, tutte le stazioni MAIN
     HUB/HUB/MAJOR secondo la classificazione ufficiale RFI, piu' i
     capoluoghi di provincia) apre in nuova scheda il tabellone di
     quella stazione tramite la nuova pagina tabellone_stazione.html.
     Se una fermata non ha match (fuori dal sottoinsieme ridotto)
     resta semplicemente testo non cliccabile — degrado consapevole,
     non un errore: coprire tutte le 2958 stazioni italiane avrebbe
     richiesto caricare un file molto piu' pesante per un beneficio
     marginale sulle fermate davvero rilevanti per l'uso quotidiano.
     Matching per nome normalizzato (accenti/punteggiatura/trattini
     rimossi) tra il nome fermata di ViaggiaTreno e il nome nel file
     stazioni_ridotte.json, che possono differire leggermente nella
     forma esatta pur riferendosi alla stessa stazione.
     Novità v1.6: ritardo per-fermata (non solo il ritardo complessivo
     nella card in alto). Ogni cella Arrivo/Partenza mostra ora un
     piccolo chip +X'/-X'/in orario accanto all'orario. Per le fermate
     gia' raggiunte uso il ritardo SPECIFICO di quella fermata
     (f.ritardoArrivo/f.ritardoPartenza, calcolato da ViaggiaTreno);
     per le fermate future, non essendoci un dato specifico affidabile
     (verificato su JSON reali: resta 0 come placeholder finche' il
     treno non arriva), uso la stessa stima "ritardo complessivo" gia'
     usata per la proiezione dell'orario — cosi' i due numeri sulla
     riga restano coerenti tra loro.
     Aggiunta anche la distinzione "fermo in stazione": uso il campo
     json.inStazione (gia' presente nei dati ViaggiaTreno, prima mai
     sfruttato in questa pagina) per capire se il treno e' fermo
     proprio alla fermata corrente. In quel caso la cella Partenza non
     mostra piu' un orario proiettato (che sarebbe falsa precisione,
     il tempo di sosta reale non e' prevedibile), ma l'indicazione
     "● in stazione" — la cella Arrivo invece resta normale, essendo
     gia' un dato confermato in quel momento.
     Novità v1.5: redesign visivo completo, ispirato al layout a
     timeline di altre app di monitoraggio treni (screenshot fornito
     dall'utente). Cambia la STRUTTURA: nuova card "posizione attuale"
     prominente in cima (stazione + orario ultimo rilevamento GPS +
     badge ritardo, prima era una riga minuscola in fondo all'header);
     percorso completo ridisegnato da elenco puntato a timeline con
     pallino/linea verticale colorata fino alla fermata corrente,
     tabella compatta Stazione/Binario/Arrivo/Partenza per riga.
     Non cambia la PALETTE: resta l'ambra come identita' del modulo
     treni (coerente col resto del progetto), non il rosso dello
     screenshot di riferimento — il rosso in questo progetto e' gia'
     riservato a errori/ritardi/cancellazioni, riusarlo per "fermata
     gia' passata" avrebbe creato ambiguita' visiva.
     Novita' funzionale, non solo estetica: le fermate non ancora
     raggiunte ora mostrano un orario PROIETTATO (teorico + ritardo
     complessivo attuale del treno), colorato in verde/ambra per
     distinguerlo chiaramente da un orario CONFERMATO (bianco, quando
     ViaggiaTreno ha gia' un dato reale per quella fermata) — prima la
     v1.x mostrava solo l'orario teorico barrato senza proiezione.
     La fermata "corrente" e' identificata sulla stazione di
     json.stazioneUltimoRilevamento (stesso campo gia' usato per il
     vecchio rilevamento GPS): se il treno non e' ancora partito o il
     nome non trova una corrispondenza esatta tra le fermate, nessuna
     riga viene evidenziata — comportamento consapevole, non un bug.
     Rimosso codice v1.x non piu' usato (blocccoOrario, formattaRitardo,
     tutte le classi CSS fermata-*) per non lasciare funzioni morte.
     NON incluso in questa versione (rimandato a un secondo giro):
     click su una fermata intermedia per aprire il tabellone di quella
     stazione in nuova scheda — le fermate intermedie del percorso non
     sono tra le stazioni configurate in dashboard_live.html, serve
     prima capire quale URL usare per una stazione generica.
     Novità v1.4: stellina preferiti anche qui, non solo nella riga
     del tabellone di dashboard_live.html. Stessa chiave localStorage
     (monitorLive.treniPreferiti) di dashboard_live.html — marcare da
     qui si riflette nel pannello "⭐ Treni preferiti" della dashboard
     e viceversa, ma solo sullo stesso dispositivo/browser: localStorage
     non sincronizza tra dispositivi diversi.
     Novità v1.3: FIX bug rilevazione cancellazione — "nonPartito" NON
     significa cancellato, significa solo "non ancora partito" (stato
     normale di un treno futuro). Verificato su dato reale (treno 4610,
     11:05, nonPartito:true ma subTitle:"" e provvedimento:0): veniva
     mostrato erroneamente come "Treno cancellato". Segnale unico e
     affidabile resta subTitle === "Treno cancellato".
     Novità v1.2: rilevazione cancellazione corretta (subTitle/nonPartito,
     non solo circolante), causa ritardo se disponibile, ultimo
     rilevamento GPS (anche fuori stazione), versione visibile in footer.
     Novità v1.1: distinzione "Transito"/"Transitato" sulle fermate
     intermedie (confronto orario con Date.now()).
     ================================================================ */
  :root {
    --bg: #14171c;
    --bg-panel: #1c2029;
    --bg-flap: #0e1015;
    --rule: #2a2f3a;
    --amber: #f0b429;
    --amber-dim: #a8801f;
    --text: #e8e6df;
    --text-muted: #7d828c;
    --red: #e2574c;
    --green: #4caf7d;
    --font-mono: 'JetBrains Mono', monospace;
    --font-sans: 'IBM Plex Sans', sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-sans); -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 1rem 1rem 3rem; }

  header { padding: 1.25rem 0 1rem; border-bottom: 1px solid var(--rule); margin-bottom: 1.25rem; }
  .btn-indietro { background: none; border: none; color: var(--text-muted); font-size: 0.8rem; padding: 0; cursor: pointer; font-family: var(--font-sans); margin-bottom: 10px; }

  .treno-header { background: var(--bg-panel); border: 1px solid var(--amber-dim); border-radius: 12px; padding: 1rem; }
  .treno-header-top { display: flex; align-items: baseline; gap: 10px; }
  .treno-header .numero { font-family: var(--font-mono); font-weight: 700; font-size: 1.5rem; color: var(--amber); }
  .treno-header .categoria { font-size: 0.78rem; color: var(--text-muted); text-transform: uppercase; }
  .btn-stella { background: none; border: none; padding: 0; font-size: 1.3rem; line-height: 1; cursor: pointer; color: var(--text-muted); margin-left: auto; }
  .btn-stella.attiva { color: var(--amber); }
  .treno-header .tratta { font-size: 0.95rem; color: var(--text); margin-top: 8px; }
  .treno-header .tratta b { font-weight: 600; }
  .treno-header .stato-riga { display: flex; gap: 14px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--rule); font-size: 0.78rem; color: var(--text-muted); flex-wrap: wrap; }
  .treno-header .stato-riga b { color: var(--text); font-family: var(--font-mono); }
  .treno-header .motivo-riga { margin-top: 8px; font-size: 0.76rem; color: var(--text-muted); font-style: italic; }
  .treno-header .rilevamento-riga { margin-top: 6px; font-size: 0.72rem; color: var(--text-muted); }
  .badge-non-circolante { display: inline-block; background: rgba(226,87,76,0.15); color: var(--red); font-size: 0.7rem; font-weight: 700; text-transform: uppercase; padding: 3px 8px; border-radius: 5px; margin-top: 8px; }

  .section-label { font-size: 0.72rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); margin: 1.5rem 0 0.6rem; padding-left: 8px; border-left: 3px solid var(--amber-dim); }

  /* Card "posizione attuale": ultima fermata rilevata + badge ritardo,
     promossa da riga minuscola in fondo all'header (v1.4) a card
     prominente in stile "prossima fermata" (v1.5). */
  .posizione-card { display: flex; justify-content: space-between; align-items: center; background: var(--bg-panel); border: 1px solid var(--rule); border-radius: 12px; padding: 0.9rem 1rem; margin-bottom: 1.25rem; gap: 10px; }
  .posizione-nome { font-size: 1.05rem; font-weight: 700; color: var(--text); }
  .posizione-sub { font-size: 0.74rem; color: var(--text-muted); margin-top: 3px; }
  .badge-ritardo { flex-shrink: 0; text-align: center; background: rgba(240,180,41,0.15); border: 1px solid var(--amber-dim); border-radius: 8px; padding: 6px 12px; }
  .badge-ritardo.zero { background: rgba(76,175,125,0.12); border-color: var(--green); }
  .badge-ritardo .valore { font-family: var(--font-mono); font-weight: 700; font-size: 1.15rem; color: var(--amber); }
  .badge-ritardo.zero .valore { color: var(--green); font-size: 0.85rem; }
  .badge-ritardo .etichetta { font-size: 0.6rem; text-transform: uppercase; color: var(--text-muted); margin-top: 1px; }

  /* Timeline percorso: colonna pallino+linea a sinistra, corpo con
     nome stazione + binario in cima, orari arrivo/partenza affiancati
     sotto. Sostituisce lo stile "elenco puntato" della v1.x precedente. */
  .percorso-wrap { border: 1px solid var(--rule); border-radius: 10px; background: var(--bg-panel); overflow: hidden; padding: 4px 0; }
  .tl-row { display: flex; gap: 10px; padding: 10px 12px; }
  .tl-linea { display: flex; flex-direction: column; align-items: center; width: 12px; flex-shrink: 0; }
  .tl-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--rule); border: 2px solid var(--bg-panel); flex-shrink: 0; margin-top: 2px; }
  .tl-dot.passata { background: var(--amber); }
  .tl-dot.corrente { background: var(--amber); width: 13px; height: 13px; box-shadow: 0 0 0 3px rgba(240,180,41,0.25); }
  .tl-bar { width: 3px; flex: 1; background: var(--rule); margin-top: 3px; border-radius: 2px; }
  .tl-bar.passata { background: var(--amber-dim); }
  .tl-corpo { flex: 1; min-width: 0; }
  .tl-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .tl-nome { font-size: 0.82rem; color: var(--text); }
  .tl-row.origine .tl-nome, .tl-row.destinazione .tl-nome { font-weight: 700; color: var(--amber); }
  .tl-row.corrente .tl-nome { font-weight: 700; color: var(--amber); }
  a.tl-nome { text-decoration: underline; text-decoration-style: dotted; text-decoration-color: var(--text-muted); text-underline-offset: 3px; cursor: pointer; }
  a.tl-nome:active { color: var(--amber); }
  .tl-bin { font-size: 0.66rem; color: var(--text-muted); flex-shrink: 0; }
  .tl-orari { display: flex; gap: 18px; margin-top: 5px; }
  .tl-blocco { display: flex; flex-direction: column; gap: 1px; }
  .tl-lbl { font-size: 0.6rem; color: var(--text-muted); text-transform: uppercase; }
  .tl-teorico { font-family: var(--font-mono); font-size: 0.68rem; color: var(--text-muted); }
  .tl-reale { font-family: var(--font-mono); font-size: 0.85rem; font-weight: 700; }
  .tl-reale.confermato { color: var(--text); }
  .tl-reale.proiettato { color: var(--green); }
  .tl-reale.proiettato.in-ritardo { color: var(--amber); }
  .tl-delta { font-family: var(--font-mono); font-size: 0.66rem; margin-left: 4px; }
  .tl-delta.pos { color: var(--amber); }
  .tl-delta.neg { color: var(--green); }
  .tl-delta.zero { color: var(--text-muted); }
  .tl-in-stazione { font-family: var(--font-mono); font-size: 0.8rem; font-weight: 700; color: var(--amber); }

  .loading, .vuoto, .errore { text-align: center; padding: 2rem 1rem; color: var(--text-muted); font-size: 0.85rem; }
  .errore { color: var(--red); }

  .dump-grezzo { margin-top: 1.5rem; }
  .dump-grezzo summary { font-size: 0.72rem; color: var(--text-muted); cursor: pointer; }
  .dump-grezzo pre { white-space: pre-wrap; font-size: 0.7rem; color: var(--text-muted); background: var(--bg-panel); border: 1px solid var(--rule); border-radius: 8px; padding: 10px; margin-top: 8px; max-height: 400px; overflow-y: auto; }

  footer { text-align: center; font-size: 0.68rem; color: var(--text-muted); margin-top: 2rem; font-family: var(--font-mono); line-height: 1.7; }
  .footer-rev { opacity: 0.6; }
</style>
</head>
<body>
<div class="wrap">
  <button class="btn-indietro" onclick="window.close()">← Chiudi scheda</button>
  <header>
    <div id="treniHeaderEl"><div class="loading">Caricamento treno...</div></div>
  </header>

  <div id="posizioneEl"></div>

  <div class="section-label">📍 Percorso completo</div>
  <div class="percorso-wrap" id="percorsoEl"><div class="loading">Caricamento fermate...</div></div>

  <footer>
    Dati ViaggiaTreno (via proxy Deno) · pagina generata dal click sul Monitor RFI<br>
    <span class="footer-rev">dettaglio_treno.html v1.9</span>
  </footer>
</div>

<script>
// ================================================================
// dettaglio_treno.html — v1.9 (2026-09-11)
// Novità v1.9: TRENI_PREFERITI_FISSI (7 treni, sempre marcati ★).
// Vedi commento di versione nel <style> per il changelog completo.
// ================================================================
const DENO_URL = 'https://happy-ferret-5445.j0ky0.deno.net';

const params = new URLSearchParams(window.location.search);
const numeroTreno = params.get('numero');

// Mappa nome-stazione -> placeIdRFI/codiceViaggiaTreno, per rendere
// cliccabile ogni fermata della timeline (v1.7). Il file e' un
// sottoinsieme ridotto (Lazio+Umbria + stazioni MAIN HUB/HUB/MAJOR
// secondo la classificazione ufficiale RFI + capoluoghi di provincia),
// non tutte le 2958 stazioni italiane — se una fermata non ha match,
// resta semplicemente testo non cliccabile, non e' un errore.
// Va ospitato nella STESSA cartella di questo file su GitHub Pages.
let mappaStazioni = new Map();

function normalizzaNomeStazione(nome) {
  return (nome || '')
    .normalize('NFKD').replace(/[\u0300-\u036f]/g, '') // rimuove accenti
    .toUpperCase()
    .replace(/['.]/g, '')
    .replace(/-/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
}

async function caricaMappaStazioni() {
  try {
    const risposta = await fetch('./stazioni_ridotte.json');
    const lista = await risposta.json();
    lista.forEach(s => mappaStazioni.set(normalizzaNomeStazione(s.nome), s));
  } catch {
    // Silenzioso: se il file non c'e'/non risponde, le fermate restano
    // semplicemente non cliccabili — degrado controllato, non un errore
    // da mostrare all'utente per una funzione accessoria.
  }
}

// Stessa chiave localStorage di dashboard_live.html (monitorLive.
// treniPreferiti) cosi' marcare/smarcare qui si riflette anche nel
// pannello "⭐ Treni preferiti" della dashboard principale, sullo
// stesso dispositivo/browser. NON e' sincronizzato tra dispositivi
// diversi: localStorage e' locale al singolo browser.
//
// TRENI_PREFERITI_FISSI (v1.9): stessa costante di dashboard_live.html
// — DA TENERE SINCRONIZZATA A MANO tra i due file, non esiste un modo
// automatico senza backend. Un treno fisso e' sempre marcato ★ e non
// si puo' togliere da qui.
const TRENI_PREFERITI_FISSI = ['598', '4721', '4097', '4523', '20677', '20703', '20711'];

function eFisso(num) {
  return TRENI_PREFERITI_FISSI.includes(String(num));
}

function ePreferito(num) {
  if (eFisso(num)) return true;
  try {
    const grezzo = localStorage.getItem('monitorLive.treniPreferiti');
    const lista = grezzo ? JSON.parse(grezzo) : [];
    return lista.includes(String(num));
  } catch { return false; }
}

function toggleFavoritoPagina() {
  if (!numeroTreno) return;
  if (eFisso(numeroTreno)) return; // un treno fisso non si toglie da qui
  try {
    const grezzo = localStorage.getItem('monitorLive.treniPreferiti');
    let lista = grezzo ? JSON.parse(grezzo) : [];
    const num = String(numeroTreno);
    if (lista.includes(num)) {
      lista = lista.filter(n => n !== num);
    } else {
      lista.push(num);
    }
    localStorage.setItem('monitorLive.treniPreferiti', JSON.stringify(lista));
  } catch { return; }

  const btn = document.getElementById('btnStella');
  if (btn) {
    const attivo = ePreferito(numeroTreno);
    btn.classList.toggle('attiva', attivo);
    btn.textContent = attivo ? '★' : '☆';
  }
}

function formattaOrario(ms) {
  if (!ms || ms <= 0) return null;
  const d = new Date(ms);
  return d.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });
}

function renderHeader(json) {
  const el = document.getElementById('treniHeaderEl');

  const fermate = Array.isArray(json.fermate) ? json.fermate : [];
  const origine = json.origine || (fermate[0] && fermate[0].stazione) || '—';
  const destinazione = json.destinazione || (fermate[fermate.length - 1] && fermate[fermate.length - 1].stazione) || '—';
  const categoria = json.categoria || json.tipoTreno || '';
  const oraPartenza = formattaOrario(json.orarioPartenza);
  const oraArrivo = formattaOrario(json.orarioArrivo);

  // FIX v1.2: "circolante" indica se il treno esiste in orario, NON se
  // la corsa di oggi e' stata cancellata. Verificato su dato reale:
  // un treno cancellato oggi aveva comunque circolante:true.
  //
  // FIX v1.3: la v1.2 aggiungeva anche "nonPartito === true" come
  // secondo segnale di cancellazione, ma questo era un errore mai
  // verificato su dati reali. "nonPartito" significa solo "il treno
  // non e' ancora partito" (stato normalissimo prima dell'orario di
  // partenza) — non ha nulla a che fare con la cancellazione. Confermato
  // su dato reale (treno 4610, non ancora partito: nonPartito:true,
  // subTitle:"", provvedimento:0, compRitardo:"non partito"). L'unico
  // segnale affidabile resta subTitle === "Treno cancellato".
  const cancellato = json.subTitle === 'Treno cancellato';
  const nonCircolante = json.circolante === false;

  // Causa del ritardo: spesso null anche su treni in ritardo (limite
  // noto dell'API ViaggiaTreno, non del nostro parser) — mostrato solo
  // se effettivamente valorizzato.
  const motivoRitardo = json.motivoRitardoPrevalente;

  // Ultimo rilevamento GPS spostato nella card dedicata renderPosizioneAttuale()
  // (v1.5) — qui restava una riga minuscola in fondo, poco visibile.

  el.innerHTML = `
    <div class="treno-header">
      <div class="treno-header-top">
        <span class="numero">${json.numeroTreno || numeroTreno}</span>
        <span class="categoria">${categoria}</span>
        <button class="btn-stella ${ePreferito(numeroTreno) ? 'attiva' : ''}" id="btnStella" onclick="toggleFavoritoPagina()" title="${eFisso(numeroTreno) ? 'Preferito fisso (non rimovibile da qui)' : 'Aggiungi/rimuovi dai preferiti'}">${ePreferito(numeroTreno) ? '★' : '☆'}</button>
      </div>
      <div class="tratta"><b>${origine}</b> → <b>${destinazione}</b></div>
      ${cancellato ? '<div class="badge-non-circolante">Treno cancellato</div>' : ''}
      ${!cancellato && nonCircolante ? '<div class="badge-non-circolante">Non in circolazione oggi</div>' : ''}
      <div class="stato-riga">
        ${oraPartenza ? `<span>Partenza <b>${oraPartenza}</b></span>` : ''}
        ${oraArrivo ? `<span>Arrivo <b>${oraArrivo}</b></span>` : ''}
      </div>
      ${motivoRitardo ? `<div class="motivo-riga">Causa: ${motivoRitardo}</div>` : ''}
    </div>`;
}

// Card "posizione attuale" (v1.5): promuove l'ultimo rilevamento GPS
// (prima riga minuscola in fondo all'header) a card prominente con
// badge ritardo, ispirata al layout "prossima fermata" di altre app
// di monitoraggio treni. Mostrata solo se il dato e' disponibile
// (treno gia' partito e con almeno un rilevamento valido) e il treno
// non e' cancellato.
function renderPosizioneAttuale(json) {
  const el = document.getElementById('posizioneEl');

  const cancellato = json.subTitle === 'Treno cancellato';
  const stazione = json.stazioneUltimoRilevamento;
  const ora = json.compOraUltimoRilevamento;
  const valido = !cancellato && stazione && stazione !== '--' && ora && ora !== '--';

  if (!valido) { el.innerHTML = ''; return; }

  const ritardo = (typeof json.ritardo === 'number') ? json.ritardo : null;
  let badgeHtml = '';
  if (ritardo !== null) {
    if (ritardo <= 0) {
      badgeHtml = `<div class="badge-ritardo zero"><div class="valore">${ritardo < 0 ? ritardo : 'In orario'}</div>${ritardo < 0 ? '<div class="etichetta">anticipo</div>' : ''}</div>`;
    } else {
      badgeHtml = `<div class="badge-ritardo"><div class="valore">+${ritardo}</div><div class="etichetta">Ritardo</div></div>`;
    }
  }

  el.innerHTML = `
    <div class="posizione-card">
      <div>
        <div class="posizione-nome">${stazione}</div>
        <div class="posizione-sub">Ultimo rilevamento: ${ora}</div>
      </div>
      ${badgeHtml}
    </div>`;
}

function renderPercorso(json) {
  const el = document.getElementById('percorsoEl');
  const fermate = Array.isArray(json.fermate) ? json.fermate : [];

  if (fermate.length === 0) {
    el.innerHTML = `
      <div class="vuoto">Percorso non disponibile in questo formato.</div>
      <details class="dump-grezzo">
        <summary>Mostra dati grezzi ricevuti</summary>
        <pre>${JSON.stringify(json, null, 2)}</pre>
      </details>`;
    return;
  }

  // Fermata "corrente" = quella dell'ultimo rilevamento GPS (stesso
  // dato usato dalla card renderPosizioneAttuale). Se non troviamo un
  // match esatto sul nome (o il treno non e' ancora partito), nessuna
  // riga viene evidenziata come "corrente" — non e' un errore, solo un
  // dato che ViaggiaTreno non fornisce sempre.
  const nomeRilevamento = (json.stazioneUltimoRilevamento || '').trim().toUpperCase();
  const indiceCorrente = nomeRilevamento
    ? fermate.findIndex(f => (f.stazione || '').trim().toUpperCase() === nomeRilevamento)
    : -1;

  const ritardoComplessivo = (typeof json.ritardo === 'number') ? json.ritardo : 0;

  // json.inStazione (campo ViaggiaTreno gia' presente, prima inutilizzato
  // in questa pagina) dice se il treno e' FERMO a una stazione in questo
  // momento, invece che in transito tra due fermate. Se e' fermo proprio
  // alla fermata corrente e non ha ancora un orario di partenza reale,
  // non ha senso proiettare un orario di partenza preciso (v1.5 lo
  // avrebbe mostrato come "teorico + ritardo attuale", ma il tempo di
  // sosta e' variabile e imprevedibile) — mostriamo invece "in stazione",
  // onesto sul fatto che non sappiamo ancora quando ripartira'.
  const fermoInStazione = json.inStazione === true;

  el.innerHTML = fermate.map((f, i) => {
    const isOrigine = i === 0;
    const isDestinazione = i === fermate.length - 1;
    const isCorrente = i === indiceCorrente;
    const isPassata = indiceCorrente >= 0 && i <= indiceCorrente;
    const tipo = [isOrigine ? 'origine' : '', isDestinazione ? 'destinazione' : '', isCorrente ? 'corrente' : ''].filter(Boolean).join(' ');

    const binario = f.binarioEffettivoArrivoDescrizione || f.binarioProgrammatoArrivoDescrizione
      || f.binarioEffettivoPartenzaDescrizione || f.binarioProgrammatoPartenzaDescrizione;

    const fermoQui = isCorrente && fermoInStazione && !f.partenzaReale;

    // Fermata cliccabile -> apre tabellone_stazione.html in nuova
    // scheda, solo se troviamo un match con placeIdRFI valorizzato
    // (senza placeId non sappiamo che tabellone RFI interrogare).
    const infoStazione = mappaStazioni.get(normalizzaNomeStazione(f.stazione));
    const nomeHtml = (infoStazione && infoStazione.placeIdRFI)
      ? `<a class="tl-nome" href="tabellone_stazione.html?placeId=${infoStazione.placeIdRFI}&nome=${encodeURIComponent(f.stazione)}${infoStazione.codiceViaggiaTreno ? `&codVT=${infoStazione.codiceViaggiaTreno}` : ''}" target="_blank" rel="noopener">${f.stazione || '—'}</a>`
      : `<span class="tl-nome">${f.stazione || '—'}</span>`;

    const blocchi = [
      !isOrigine ? blocccoOrarioTimeline('Arrivo', f.arrivo_teorico, f.arrivoReale, ritardoComplessivo, f.ritardoArrivo) : '',
      !isDestinazione ? (fermoQui ? bloccoInStazione() : blocccoOrarioTimeline('Partenza', f.partenza_teorica, f.partenzaReale, ritardoComplessivo, f.ritardoPartenza)) : '',
    ].filter(Boolean).join('');

    return `
      <div class="tl-row ${tipo}">
        <div class="tl-linea">
          <div class="tl-dot ${isPassata ? 'passata' : ''} ${isCorrente ? 'corrente' : ''}"></div>
          ${!isDestinazione ? `<div class="tl-bar ${isPassata && i < indiceCorrente ? 'passata' : ''}"></div>` : ''}
        </div>
        <div class="tl-corpo">
          <div class="tl-top">
            ${nomeHtml}
            ${binario ? `<span class="tl-bin">Bin. ${binario}</span>` : ''}
          </div>
          <div class="tl-orari">${blocchi}</div>
        </div>
      </div>`;
  }).join('');
}

// Blocco orario per una singola cella (Arrivo o Partenza) della
// timeline. Se il dato reale non c'e' ancora (fermata non raggiunta),
// proiettiamo l'orario teorico sommando il ritardo complessivo attuale
// del treno — e' una stima, non un dato confermato da ViaggiaTreno,
// per questo colorata diversamente (verde/ambra) dall'orario
// confermato (bianco). Se il treno e' in orario la proiezione coincide
// col teorico, quindi la distinzione visiva resta comunque onesta.
//
// v1.6: aggiunto il chip di ritardo accanto all'orario. Quando la
// fermata e' gia' stata raggiunta, uso il ritardo SPECIFICO di quella
// fermata (f.ritardoArrivo / f.ritardoPartenza, dato reale gia'
// calcolato da ViaggiaTreno) — non quello complessivo del treno, che
// puo' differire fermata per fermata. Per le fermate future, non c'e'
// un dato specifico affidabile (abbiamo verificato su dati reali che
// resta a 0 come placeholder finche' il treno non arriva), quindi il
// chip usa la stessa stima "ritardo complessivo" gia' usata per la
// proiezione dell'orario, per coerenza tra i due numeri sulla riga.
function blocccoOrarioTimeline(etichetta, teoricoMs, realeMs, ritardoComplessivo, ritardoSpecifico) {
  if (!teoricoMs && !realeMs) return '';

  const teoricoTxt = formattaOrario(teoricoMs);
  let valoreTxt, classe, ritardoMostrato;

  if (realeMs) {
    valoreTxt = formattaOrario(realeMs);
    classe = 'confermato';
    ritardoMostrato = (typeof ritardoSpecifico === 'number') ? ritardoSpecifico : null;
  } else if (teoricoMs) {
    const proiettatoMs = teoricoMs + (ritardoComplessivo * 60000);
    valoreTxt = formattaOrario(proiettatoMs);
    classe = ritardoComplessivo > 0 ? 'proiettato in-ritardo' : 'proiettato';
    ritardoMostrato = ritardoComplessivo;
  } else {
    valoreTxt = teoricoTxt;
    classe = 'proiettato';
    ritardoMostrato = null;
  }

  return `
    <div class="tl-blocco">
      <span class="tl-lbl">${etichetta}</span>
      ${teoricoTxt ? `<span class="tl-teorico">${teoricoTxt}</span>` : ''}
      <span class="tl-reale ${classe}">${valoreTxt}${formattaDelta(ritardoMostrato)}</span>
    </div>`;
}

function formattaDelta(min) {
  if (min === null || min === undefined) return '';
  if (min === 0) return `<span class="tl-delta zero">in orario</span>`;
  const cls = min > 0 ? 'pos' : 'neg';
  const segno = min > 0 ? '+' : '';
  return `<span class="tl-delta ${cls}">${segno}${min}'</span>`;
}

// Cella "in stazione": usata al posto della partenza proiettata quando
// il treno e' fermo proprio a questa fermata e non e' ancora ripartito
// — un orario di partenza proiettato sarebbe falsa precisione, il
// tempo di sosta effettivo non e' prevedibile dai dati che abbiamo.
function bloccoInStazione() {
  return `
    <div class="tl-blocco">
      <span class="tl-lbl">Partenza</span>
      <span class="tl-in-stazione">● in stazione</span>
    </div>`;
}

async function caricaDettaglio() {
  if (!numeroTreno) {
    document.getElementById('treniHeaderEl').innerHTML = '<div class="errore">Nessun numero treno specificato nell\'URL (manca ?numero=...)</div>';
    document.getElementById('percorsoEl').innerHTML = '';
    return;
  }

  try {
    const [rispostaTreno] = await Promise.all([
      fetch(`${DENO_URL}/treno/${encodeURIComponent(numeroTreno)}`),
      caricaMappaStazioni(),
    ]);
    const json = await rispostaTreno.json();

    if (json.errore) {
      document.getElementById('treniHeaderEl').innerHTML = `<div class="errore">${json.errore}</div>`;
      document.getElementById('percorsoEl').innerHTML = '';
      return;
    }

    renderHeader(json);
    renderPosizioneAttuale(json);
    renderPercorso(json);

  } catch (errore) {
    document.getElementById('treniHeaderEl').innerHTML = `<div class="errore">Errore di connessione: ${errore.message}</div>`;
    document.getElementById('percorsoEl').innerHTML = '';
  }
}

document.title = numeroTreno ? `Treno ${numeroTreno} — Monitor Live` : 'Dettaglio treno — Monitor Live';
caricaDettaglio();
</script>
</body>
</html>
