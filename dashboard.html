<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#14171c">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📊</text></svg>">
<title>Monitor Treni — Statistiche</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
  /* ================================================================
     dashboard.html — v2.4 (2026-09-19)
     Novità v2.4 — RICHIEDE prima l'esecuzione della v2 di
     dashboard_setup.sql su Supabase (aggiunge orario_partenza_previsto/
     orario_arrivo_previsto/num_partenze/num_arrivi alla RPC), altrimenti
     queste colonne/il riepilogo restano vuoti:
     (1) Colonne "Orario part." e "Orario arr." in tabella — orario
     PROGRAMMATO (non il ritardo, quello già c'era), valore più
     frequente per quel treno+stazione (MODE, gestisce i casi in cui
     un treno abbia orari leggermente diversi in giorni diversi).
     (2) Numero treno cliccabile in tabella: filtra la vista solo su
     quel treno (resta sulla stessa pagina, non apre nulla di nuovo).
     (3) Card "riepilogo per treno" (visibile solo quando il risultato
     filtrato riguarda UN SOLO numero treno): mostra la stazione da cui
     parte più spesso e quella in cui arriva più spesso, con orario e
     conteggio rilevazioni — utile perché alcuni numeri treno vengono
     riusati su percorsi diversi in giorni diversi (cambio numero), una
     singola riga presa a caso non è sempre rappresentativa del
     "percorso normale" di quel numero.
     Novità v2.3: due nuovi filtri, "Categoria treno" (REG/IC/AV/ITA/EN
     — dalla stessa colonna Excel, nota: R ed RV non distinti a monte,
     compaiono uniti come "REG") e "Priorità" (la tua classificazione
     1-5). Applicati LATO CLIENT sul risultato già arrivato dalla RPC
     dashboard_stats (che non conosce questi due dati, vivono solo
     nell'Excel) — nessuna modifica a Supabase necessaria. Un treno non
     ancora classificato nell'Excel viene escluso se il filtro
     corrispondente è attivo (non può soddisfare un criterio ignoto).
     Novità v2.2: menu "Numero treno" raggruppato per priorità
     (CLASSIFICAZIONE_TRENI, scala 1-5 dal foglio "Treni Archivio" di
     treni_archivio_0_1.xlsx — 1 = treno chiave, 5 = secondario). I
     tuoi treni chiave compaiono per primi nel menu, sotto l'etichetta
     "★ Treni chiave", invece di un elenco piatto senza indicazione di
     rilevanza. Treni non ancora classificati nell'Excel finiscono nel
     gruppo "Non classificato" in fondo, senza sparire.
     Identità: MONITOR TRENI (Statistiche) — accento VIOLA, per
     distinguersi a colpo d'occhio dalla Dashboard Live (ambra/teal).
     Stesso sfondo neutro condiviso tra i due strumenti del progetto.
     ================================================================ */
  :root {
    --bg: #14171c;
    --bg-panel: #1c2029;
    --bg-flap: #0e1015;
    --rule: #2a2f3a;
    --viola: #a78bfa;
    --viola-dim: #6d5bd0;
    --text: #e8e6df;
    --text-muted: #7d828c;
    --red: #e2574c;
    --green: #4caf7d;
    --font-mono: 'JetBrains Mono', monospace;
    --font-sans: 'IBM Plex Sans', sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-sans); -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 1rem 1rem 3rem; }
  header { padding: 1.25rem 0 1rem; border-bottom: 1px solid var(--rule); margin-bottom: 1.25rem; }
  .titolo { font-family: var(--font-mono); font-weight: 700; font-size: 1.3rem; letter-spacing: 0.02em; color: var(--viola); display: flex; align-items: baseline; gap: 0.5rem; }
  .titolo .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); display: inline-block; animation: pulse 2.4s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
  .sottotitolo { font-size: 0.8rem; color: var(--text-muted); margin-top: 0.3rem; font-family: var(--font-mono); }
  .filtri { background: var(--bg-panel); border: 1px solid var(--rule); border-radius: 10px; padding: 1rem; margin-bottom: 1.25rem; }
  .filtri-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
  .campo { display: flex; flex-direction: column; gap: 0.3rem; }
  .campo.full { grid-column: 1 / -1; }
  .campo label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); font-weight: 500; }
  select, input[type="time"] { background: var(--bg-flap); border: 1px solid var(--rule); color: var(--text); font-family: var(--font-mono); font-size: 0.9rem; padding: 0.5rem 0.6rem; border-radius: 6px; width: 100%; }
  select:focus, input:focus { outline: 2px solid var(--viola-dim); outline-offset: 1px; }
  .orario-range { display: flex; gap: 0.5rem; align-items: center; }
  .orario-range span { color: var(--text-muted); font-size: 0.8rem; }
  .azioni { display: flex; gap: 0.6rem; margin-top: 1rem; }
  button { font-family: var(--font-sans); font-weight: 600; font-size: 0.85rem; padding: 0.6rem 1rem; border-radius: 6px; border: none; cursor: pointer; flex: 1; }
  .btn-cerca { background: var(--viola); color: #1a1035; }
  .btn-cerca:active { transform: scale(0.98); }
  .btn-reset { background: transparent; color: var(--text-muted); border: 1px solid var(--rule); }
  .riepilogo { font-family: var(--font-mono); font-size: 0.8rem; color: var(--text-muted); margin-bottom: 1rem; min-height: 1.2rem; }
  .board-wrap { overflow-x: auto; border: 1px solid var(--rule); border-radius: 10px; margin-bottom: 1.5rem; -webkit-overflow-scrolling: touch; }
  table { border-collapse: collapse; width: 100%; min-width: 560px; background: var(--bg-panel); }
  th { font-family: var(--font-sans); font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); text-align: left; padding: 0.6rem 0.7rem; border-bottom: 1px solid var(--rule); font-weight: 600; white-space: nowrap; }
  td { padding: 0.5rem 0.7rem; border-bottom: 1px solid var(--rule); font-size: 0.85rem; white-space: nowrap; }
  tr:last-child td { border-bottom: none; }
  .flap { display: inline-block; font-family: var(--font-mono); font-weight: 700; background: var(--bg-flap); border: 1px solid var(--rule); border-radius: 4px; padding: 0.15rem 0.45rem; min-width: 2.4em; text-align: center; }
  .flap.rit-neg { color: var(--green); }
  .flap.rit-zero { color: var(--text-muted); }
  .flap.rit-pos { color: var(--red); }
  .num-treno { font-family: var(--font-mono); color: var(--viola); font-weight: 700; }
  .num-treno.cliccabile { cursor: pointer; text-decoration: underline; text-decoration-style: dotted; text-underline-offset: 3px; }
  .num-treno.cliccabile:active { color: var(--text); }
  .orario-cell { font-family: var(--font-mono); font-size: 0.78rem; color: var(--text-muted); }
  .stazione-cell { color: var(--text); font-size: 0.8rem; }

  .riepilogo-treno-card { display: flex; gap: 1rem; flex-wrap: wrap; background: var(--bg-panel); border: 1px solid var(--viola-dim); border-radius: 10px; padding: 0.8rem 1rem; margin-bottom: 1rem; }
  .riepilogo-treno-voce { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 180px; }
  .riepilogo-treno-voce .etichetta { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); }
  .riepilogo-treno-voce .valore { font-size: 0.95rem; font-weight: 700; color: var(--text); }
  .riepilogo-treno-voce .dettaglio { font-family: var(--font-mono); font-size: 0.72rem; color: var(--viola); }
  .vuoto, .loading, .errore { text-align: center; padding: 2rem 1rem; color: var(--text-muted); font-size: 0.85rem; }
  .errore { color: var(--red); }
  .chart-section { background: var(--bg-panel); border: 1px solid var(--rule); border-radius: 10px; padding: 1rem; }
  .chart-title { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); margin: 0 0 0.75rem; font-weight: 600; }
  .chart-container { position: relative; height: 280px; }
  footer { text-align: center; font-size: 0.7rem; color: var(--text-muted); margin-top: 2rem; font-family: var(--font-mono); }
  @media (max-width: 420px) { .filtri-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="titolo"><span class="dot"></span>MONITOR TRENI · STATISTICHE</div>
    <div class="sottotitolo" id="ultimoAggiornamento">Caricamento stato...</div>
  </header>

  <div class="filtri">
    <div class="filtri-grid">
      <div class="campo full">
        <label for="filtroTreno">Numero treno</label>
        <select id="filtroTreno"><option value="">Tutti i treni</option></select>
      </div>
      <div class="campo full">
        <label for="filtroStazione">Stazione</label>
        <select id="filtroStazione"><option value="">Tutte le stazioni</option></select>
      </div>
      <div class="campo">
        <label for="filtroCategoria">Categoria treno</label>
        <select id="filtroCategoria">
          <option value="">Tutte</option>
          <option value="REG">REG (Regionale/RV)</option>
          <option value="IC">IC</option>
          <option value="AV">AV</option>
          <option value="ITA">ITA (Italo)</option>
          <option value="EN">EN (Euronight)</option>
        </select>
      </div>
      <div class="campo">
        <label for="filtroClassificazione">Priorità (tua classificazione)</label>
        <select id="filtroClassificazione">
          <option value="">Tutte</option>
          <option value="1">★ Classe 1 — chiave</option>
          <option value="2">Classe 2</option>
          <option value="3">Classe 3</option>
          <option value="4">Classe 4</option>
          <option value="5">Classe 5 — secondari</option>
        </select>
      </div>
      <div class="campo full">
        <label>Fascia oraria partenza (opzionale)</label>
        <div class="orario-range">
          <input type="time" id="oraInizio">
          <span>—</span>
          <input type="time" id="oraFine">
        </div>
      </div>
    </div>
    <div class="azioni">
      <button class="btn-reset" onclick="resetFiltri()">Azzera</button>
      <button class="btn-cerca" onclick="caricaDati()">Applica filtri</button>
    </div>
  </div>

  <div class="riepilogo" id="riepilogo"></div>
  <div id="riepilogoTreno"></div>

  <div class="board-wrap">
    <table>
      <thead>
        <tr>
          <th>Treno</th><th>Stazione</th><th>Rilev.</th><th>Orario part.</th><th>Orario arr.</th><th>Rit. partenza</th><th>Rit. arrivo</th><th>Min / Max</th>
        </tr>
      </thead>
      <tbody id="tabellaBody">
        <tr><td colspan="8" class="loading">Caricamento dati...</td></tr>
      </tbody>
    </table>
  </div>

  <div class="chart-section">
    <p class="chart-title">Ritardo medio in partenza per treno (min. 2 rilevazioni)</p>
    <div class="chart-container"><canvas id="graficoRitardi"></canvas></div>
  </div>

  <footer>dati raccolti da ViaggiaTreno · aggiornati automaticamente ogni sera<br><span style="opacity:0.6">dashboard.html v2.4</span></footer>
</div>

<script>
// ================================================================
// dashboard.html — v2.4 (2026-09-19)
// Novità v2.4: colonne orario programmato, numero treno cliccabile
// (filtra la vista), riepilogo partenza/arrivo più frequente per
// treno. RICHIEDE la v2 di dashboard_setup.sql eseguita su Supabase
// prima di funzionare. Vedi commento di versione nel <style>.
// ================================================================
// CONFIGURAZIONE — queste due righe sono le UNICHE da controllare
// ================================================================
const SUPABASE_URL = "https://ppjmwwnywxesxnqqaryt.supabase.co"; // <-- VERIFICA che sia il tuo Project URL esatto
const SUPABASE_ANON_KEY = "sb_publishable_ppQxHMlhZmEsKpeHgHUHww_i4cxVSjp"; // <-- gia' inserita

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let chartInstance = null;

// ----------------------------------------------------------------
// CLASSIFICAZIONE_TRENI (v2.2): priorità 1 (chiave, sempre in primo
// piano) a 5 (secondaria, solo per analisi cause a cascata) — stessa
// scala già usata per i bus (Utilità). Fonte: foglio "Treni Archivio"
// di treni_archivio_0_1.xlsx, colonna "Classificazione (1-5)".
// Per aggiornare: modifica questo oggetto, nessun'altra modifica
// necessaria. I treni non presenti qui (non ancora classificati
// nell'Excel) finiscono nel gruppo "Non classificato" in fondo al menu.
// ----------------------------------------------------------------
const CLASSIFICAZIONE_TRENI = {"294":3,"531":3,"540":5,"598":1,"4095":3,"4097":1,"4105":4,"4106":2,"4107":1,"4110":5,"4150":5,"4151":3,"4155":3,"4156":2,"4158":1,"4196":4,"4256":1,"4520":4,"4521":2,"4523":1,"4530":2,"4534":2,"4539":4,"4719":1,"4721":1,"4731":4,"4732":2,"4733":4,"4734":3,"4736":2,"8528":2,"8968":4,"9326":2,"9328":2,"9432":2,"9434":2,"9508":4,"9556":2,"9560":2,"9660":2,"9662":2,"9944":4,"9954":4,"9992":4,"9994":4,"20395":4,"20397":4,"20405":4,"20411":3,"20423":2,"20439":2,"20485":4,"20491":4,"20493":4,"20497":3,"20503":3,"20509":3,"20517":4,"20523":4,"20529":4,"20539":4,"20547":1,"20665":4,"20675":2,"20677":1,"20683":3,"20687":3,"20693":3,"20703":1,"20711":1,"20717":2,"20721":2,"20731":4,"21379":4,"9563":4};

// CATEGORIA_TRENI (v2.3): stessa fonte/foglio, colonna "Categoria
// (R/IC/AV...)". Nota: nell'Excel R ed RV non sono distinti, sono
// entrambi "REG" — se in futuro servisse separarli, va aggiunta quella
// distinzione nell'Excel a monte, qui posso solo riflettere quello che
// c'è nella colonna sorgente.
const CATEGORIA_TRENI = {"294":"EN","531":"IC","540":"IC","598":"IC","4095":"REG","4097":"REG","4105":"REG","4106":"REG","4107":"REG","4110":"REG","4150":"REG","4151":"REG","4155":"REG","4156":"REG","4158":"REG","4196":"REG","4256":"REG","4520":"REG","4521":"REG","4523":"REG","4530":"REG","4534":"REG","4539":"REG","4719":"REG","4721":"REG","4731":"REG","4732":"REG","4733":"REG","4734":"REG","4736":"REG","8528":"AV","8968":"ITA","9326":"AV","9328":"AV","9432":"AV","9434":"AV","9508":"AV","9556":"AV","9560":"AV","9660":"AV","9662":"AV","9944":"ITA","9954":"ITA","9992":"ITA","9994":"ITA","20395":"REG","20397":"REG","20405":"REG","20411":"REG","20423":"REG","20439":"REG","20485":"REG","20491":"REG","20493":"REG","20497":"REG","20503":"REG","20509":"REG","20517":"REG","20523":"REG","20529":"REG","20539":"REG","20547":"REG","20665":"REG","20675":"REG","20677":"REG","20683":"REG","20687":"REG","20693":"REG","20703":"REG","20711":"REG","20717":"REG","20721":"REG","20731":"REG","21379":"REG","9563":"AV"};

const ETICHETTA_CLASSE = {
  1: '★ Treni chiave',
  2: 'Classe 2',
  3: 'Classe 3',
  4: 'Classe 4',
  5: 'Classe 5 — secondari',
};

async function popolaFiltri() {
  const { data: treni } = await sb.from('lista_treni').select('numero_treno');
  const selTreno = document.getElementById('filtroTreno');

  // Raggruppa per classe (1 -> 5, poi "Non classificato" in fondo),
  // ordinando per numero treno crescente dentro ogni gruppo — così il
  // menu porta subito i treni chiave in cima invece di un elenco
  // piatto senza indicazione di rilevanza.
  const gruppi = { 1: [], 2: [], 3: [], 4: [], 5: [], nc: [] };
  (treni || []).forEach(r => {
    const classe = CLASSIFICAZIONE_TRENI[String(r.numero_treno)];
    (gruppi[classe] || gruppi.nc).push(r.numero_treno);
  });
  Object.values(gruppi).forEach(lista => lista.sort((a, b) => a - b));

  [1, 2, 3, 4, 5].forEach(classe => {
    if (gruppi[classe].length === 0) return;
    const optgroup = document.createElement('optgroup');
    optgroup.label = ETICHETTA_CLASSE[classe];
    gruppi[classe].forEach(num => {
      const opt = document.createElement('option');
      opt.value = num; opt.textContent = num;
      optgroup.appendChild(opt);
    });
    selTreno.appendChild(optgroup);
  });
  if (gruppi.nc.length > 0) {
    const optgroup = document.createElement('optgroup');
    optgroup.label = 'Non classificato';
    gruppi.nc.forEach(num => {
      const opt = document.createElement('option');
      opt.value = num; opt.textContent = num;
      optgroup.appendChild(opt);
    });
    selTreno.appendChild(optgroup);
  }

  const { data: stazioni } = await sb.from('lista_stazioni').select('nome_stazione_fermata');
  const selStaz = document.getElementById('filtroStazione');
  (stazioni || []).forEach(r => {
    const opt = document.createElement('option');
    opt.value = r.nome_stazione_fermata; opt.textContent = r.nome_stazione_fermata;
    selStaz.appendChild(opt);
  });
}

async function mostraUltimoAggiornamento() {
  const { data } = await sb.from('ultimo_aggiornamento').select('*').single();
  const el = document.getElementById('ultimoAggiornamento');
  el.textContent = (data && data.ultima_data) ? `ultimo aggiornamento: ${data.ultima_data}` : 'nessun dato disponibile';
}

function formattaRitardo(valore) {
  if (valore === null || valore === undefined) return '<span class="flap rit-zero">—</span>';
  const cls = valore > 0 ? 'rit-pos' : valore < 0 ? 'rit-neg' : 'rit-zero';
  const segno = valore > 0 ? '+' : '';
  return `<span class="flap ${cls}">${segno}${valore}'</span>`;
}

function leggiFiltri() {
  return {
    p_numero_treno: document.getElementById('filtroTreno').value || null,
    p_stazione: document.getElementById('filtroStazione').value || null,
    p_ora_inizio: document.getElementById('oraInizio').value || null,
    p_ora_fine: document.getElementById('oraFine').value || null
  };
}

function resetFiltri() {
  document.getElementById('filtroTreno').value = '';
  document.getElementById('filtroStazione').value = '';
  document.getElementById('filtroCategoria').value = '';
  document.getElementById('filtroClassificazione').value = '';
  document.getElementById('oraInizio').value = '';
  document.getElementById('oraFine').value = '';
  caricaDati();
}

async function caricaDati() {
  const tbody = document.getElementById('tabellaBody');
  const riepilogo = document.getElementById('riepilogo');
  tbody.innerHTML = '<tr><td colspan="8" class="loading">Caricamento dati...</td></tr>';
  riepilogo.textContent = '';

  const { data: datiGrezzi, error } = await sb.rpc('dashboard_stats', leggiFiltri());

  if (error) {
    tbody.innerHTML = `<tr><td colspan="8" class="errore">Errore: ${error.message}</td></tr>`;
    return;
  }

  // Filtri categoria/classificazione: applicati QUI, lato client, non
  // passati come parametro alla RPC — Supabase non conosce questi due
  // dati (vivono solo nell'Excel), quindi filtriamo il risultato gia'
  // arrivato incrociandolo con CATEGORIA_TRENI/CLASSIFICAZIONE_TRENI
  // per numero treno. Un treno non presente in una delle due mappe
  // (non ancora classificato nell'Excel) viene escluso se quel filtro
  // e' attivo — non puo' soddisfare un criterio che non conosciamo.
  const categoriaSel = document.getElementById('filtroCategoria').value;
  const classeSel = document.getElementById('filtroClassificazione').value;
  const data = (datiGrezzi || []).filter(r => {
    const num = String(r.numero_treno);
    if (categoriaSel && CATEGORIA_TRENI[num] !== categoriaSel) return false;
    if (classeSel && String(CLASSIFICAZIONE_TRENI[num]) !== classeSel) return false;
    return true;
  });

  if (!data || data.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="vuoto">Nessun risultato con questi filtri</td></tr>';
    if (chartInstance) chartInstance.destroy();
    return;
  }
  riepilogo.textContent = `${data.length} combinazioni treno/stazione trovate`;
  tbody.innerHTML = data.map(r => `
    <tr>
      <td class="num-treno cliccabile" onclick="filtraSuTreno('${r.numero_treno}')" title="Filtra solo su questo treno">${r.numero_treno}</td>
      <td class="stazione-cell">${r.nome_stazione_fermata}</td>
      <td>${r.num_rilevazioni}</td>
      <td class="orario-cell">${r.orario_partenza_previsto || '—'}</td>
      <td class="orario-cell">${r.orario_arrivo_previsto || '—'}</td>
      <td>${formattaRitardo(r.ritardo_medio_partenza)}</td>
      <td>${formattaRitardo(r.ritardo_medio_arrivo)}</td>
      <td style="color:var(--text-muted); font-family:var(--font-mono); font-size:0.78rem;">${r.ritardo_minimo ?? '—'} / ${r.ritardo_massimo ?? '—'}</td>
    </tr>`).join('');
  disegnaGrafico(data);
  disegnaRiepilogoTreno(data);
}

// Click sul numero treno in tabella: filtra la vista solo su quel
// treno, senza aprire nulla di separato — resti sulla stessa pagina.
function filtraSuTreno(numero) {
  document.getElementById('filtroTreno').value = String(numero);
  caricaDati();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// Riepilogo "stazione di partenza/arrivo più frequente" (v2.4):
// mostrato solo quando il risultato filtrato riguarda UN SOLO numero
// treno (perché altrimenti mischierebbe stazioni di treni diversi).
// Utile perché alcuni numeri treno vengono riusati su percorsi diversi
// in giorni differenti ("cambio numero") — la stazione con più
// occorrenze come partenza/arrivo è un indicatore più affidabile del
// "percorso normale" di quel numero rispetto a una riga presa a caso.
function disegnaRiepilogoTreno(data) {
  const el = document.getElementById('riepilogoTreno');
  const numeriDistinti = new Set(data.map(r => r.numero_treno));

  if (numeriDistinti.size !== 1) {
    el.innerHTML = '';
    return;
  }

  const partenzaTop = data.filter(r => r.num_partenze > 0)
    .sort((a, b) => b.num_partenze - a.num_partenze)[0];
  const arrivoTop = data.filter(r => r.num_arrivi > 0)
    .sort((a, b) => b.num_arrivi - a.num_arrivi)[0];

  if (!partenzaTop && !arrivoTop) { el.innerHTML = ''; return; }

  el.innerHTML = `
    <div class="riepilogo-treno-card">
      ${partenzaTop ? `
        <div class="riepilogo-treno-voce">
          <span class="etichetta">Parte più spesso da</span>
          <span class="valore">${partenzaTop.nome_stazione_fermata}</span>
          <span class="dettaglio">${partenzaTop.orario_partenza_previsto || '—'} · ${partenzaTop.num_partenze} rilevazioni</span>
        </div>` : ''}
      ${arrivoTop ? `
        <div class="riepilogo-treno-voce">
          <span class="etichetta">Arriva più spesso a</span>
          <span class="valore">${arrivoTop.nome_stazione_fermata}</span>
          <span class="dettaglio">${arrivoTop.orario_arrivo_previsto || '—'} · ${arrivoTop.num_arrivi} rilevazioni</span>
        </div>` : ''}
    </div>`;
}

function disegnaGrafico(data) {
  const filtrati = data.filter(r => r.num_rilevazioni >= 2 && r.ritardo_medio_partenza !== null)
    .sort((a, b) => b.ritardo_medio_partenza - a.ritardo_medio_partenza).slice(0, 15);
  const ctx = document.getElementById('graficoRitardi');
  if (chartInstance) chartInstance.destroy();
  chartInstance = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: filtrati.map(r => `${r.numero_treno}`),
      datasets: [{
        data: filtrati.map(r => r.ritardo_medio_partenza),
        backgroundColor: filtrati.map(r => r.ritardo_medio_partenza > 3 ? '#e2574c' : r.ritardo_medio_partenza > 0 ? '#a78bfa' : '#4caf7d'),
        borderRadius: 3,
      }]
    },
    options: {
      indexAxis: 'y', responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { ticks: { color: '#7d828c', font: { family: 'JetBrains Mono', size: 10 } }, grid: { color: '#2a2f3a' }, title: { display: true, text: 'minuti', color: '#7d828c', font: { size: 10 } } },
        y: { ticks: { color: '#e8e6df', font: { family: 'JetBrains Mono', size: 11 } }, grid: { display: false } }
      }
    }
  });
}

(async function init() {
  await popolaFiltri();
  await mostraUltimoAggiornamento();
  await caricaDati();
})();
</script>
